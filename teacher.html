<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trail of Tears — Teacher Dashboard</title><style>
:root{--ink:#302820;--muted:#756657;--paper:#fbf5e8;--accent:#6f4e37;--line:#d8c9ad;--good:#557b46;--warn:#aa7627;--bad:#a94e45}*{box-sizing:border-box}body{margin:0;background:#efe6d5;color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1500px;margin:auto;padding:22px}.top{display:flex;gap:16px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 5px 18px #6f4e3712}h1{font-family:Georgia,serif;margin:0 0 5px}.muted{color:var(--muted)}.auth{display:flex;gap:8px;align-items:center;flex-wrap:wrap}input,select,button{font:inherit;border:1px solid #baa98d;border-radius:9px;padding:9px 11px;background:white}button{cursor:pointer;font-weight:700}button.primary{background:var(--accent);color:white;border-color:var(--accent)}.kpis{display:grid;grid-template-columns:repeat(4,minmax(160px,1fr));gap:12px;margin:16px 0}.kpi strong{display:block;font-size:28px;font-family:Georgia,serif}.filters{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}.table-wrap{overflow:auto;max-height:68vh;border-radius:12px;border:1px solid var(--line);background:white}table{border-collapse:separate;border-spacing:0;min-width:1850px;width:100%;font-size:12px}th,td{padding:8px;border-right:1px solid #eadfcd;border-bottom:1px solid #eadfcd;vertical-align:top}th{position:sticky;top:0;background:#6f4e37;color:white;z-index:3;text-align:left}.student{position:sticky;left:0;background:#fffdf8;z-index:2;font-weight:700}.classcol{position:sticky;left:170px;background:#fffdf8;z-index:2}.mission-cell{min-width:145px}.tag{display:inline-block;padding:2px 7px;border-radius:999px;font-weight:750;font-size:10px}.done{background:#e2f0d9;color:#3f642f}.attempted{background:#fff2cc;color:#7a5b18}.started{background:#ddebf7;color:#315c80}.notstarted{background:#f4cccc;color:#8a3d37}.error{color:var(--bad);font-weight:700}.small{font-size:11px}.empty{padding:35px;text-align:center;color:var(--muted)}@media(max-width:800px){.kpis{grid-template-columns:1fr 1fr}}
</style></head><body><div class="wrap"><div class="top"><div><h1>Trail of Tears — Teacher Dashboard</h1><div class="muted">First attempt is frozen centrally. Retakes improve Best score but never overwrite First try.</div></div><div class="auth"><input id="code" type="password" placeholder="Teacher code"><button class="primary" id="load">Load results</button><button id="refresh">Refresh</button><button id="excel">Export Excel</button></div></div>
<div id="msg" class="small muted" style="margin-top:8px"></div><div class="kpis"><div class="card kpi"><span>Connected</span><strong id="kConnected">—</strong></div><div class="card kpi"><span>Active</span><strong id="kActive">—</strong></div><div class="card kpi"><span>Connected, no mission</span><strong id="kInactive">—</strong></div><div class="card kpi"><span>All missions complete</span><strong id="kComplete">—</strong></div></div>
<div class="card"><div class="filters"><input id="search" placeholder="Search student"><select id="classFilter"><option value="">All classes</option></select><select id="statusFilter"><option value="">All statuses</option><option>Connected — no mission started</option><option>Active</option><option>All completed</option></select></div><div class="table-wrap"><table><thead><tr><th style="min-width:170px">Student</th><th style="min-width:110px">Class</th><th>Connected</th><th>Last activity</th><th>Overall</th><th>M1</th><th>M2</th><th>M3</th><th>M4</th><th>M5</th><th>M6</th><th>M7</th></tr></thead><tbody id="rows"><tr><td colspan="12" class="empty">Enter the teacher code and load results.</td></tr></tbody></table></div></div></div>
<script>
const M=['m1','m2','m3','m4','m5','m6','m7'];let data=[];const $=s=>document.querySelector(s);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(v){if(!v)return '—';return new Date(v).toLocaleString()}function ms(m){if(m.completed)return ['Completed','done'];if(m.attempts>0)return ['Attempted','attempted'];if(m.startedAt)return ['Started','started'];return ['Not started','notstarted']}function mcell(m){const [st,cl]=ms(m);return `<td class="mission-cell"><span class="tag ${cl}">${st}</span><br><b>First:</b> ${m.firstScore===null?'—':m.firstScore+'%'} &nbsp; <b>Best:</b> ${m.bestScore===null?'—':m.bestScore+'%'}<br><b>Tries:</b> ${m.attempts}</td>`}function render(){let xs=[...data];const q=$('#search').value.trim().toLowerCase(),g=$('#classFilter').value,st=$('#statusFilter').value;if(q)xs=xs.filter(s=>(s.name+' '+s.group).toLowerCase().includes(q));if(g)xs=xs.filter(s=>s.group===g);if(st)xs=xs.filter(s=>s.status===st);$('#rows').innerHTML=xs.length?xs.map(s=>`<tr><td class="student">${esc(s.name)}</td><td class="classcol">${esc(s.group)}</td><td>${fmt(s.connectedAt)}</td><td>${fmt(s.lastActivity)}</td><td><b>${esc(s.status)}</b><br>${s.completedMissions}/7 complete</td>${M.map(m=>mcell(s.missions[m])).join('')}</tr>`).join(''):`<tr><td colspan="12" class="empty">No learner matches these filters.</td></tr>`}function kpis(){const n=data.length,a=data.filter(s=>s.startedMissions>0).length,c=data.filter(s=>s.completedMissions===7).length;$('#kConnected').textContent=n;$('#kActive').textContent=a;$('#kInactive').textContent=n-a;$('#kComplete').textContent=c}async function load(){const code=$('#code').value;if(!code){$('#msg').textContent='Enter the teacher code.';return}$('#msg').textContent='Loading…';try{const r=await fetch('/api/teacher-results',{headers:{'x-teacher-code':code}});const j=await r.json();if(!r.ok)throw new Error(j.error||'Could not load');data=j.students||[];const groups=[...new Set(data.map(s=>s.group).filter(Boolean))].sort();$('#classFilter').innerHTML='<option value="">All classes</option>'+groups.map(g=>`<option>${esc(g)}</option>`).join('');kpis();render();$('#msg').textContent=`Updated ${new Date(j.generatedAt).toLocaleString()} · ${j.eventCount} tracking events.`}catch(e){$('#msg').innerHTML=`<span class="error">${esc(e.message)}</span>`}}async function excel(){const code=$('#code').value;if(!code)return;$('#msg').textContent='Preparing Excel…';try{const r=await fetch('/api/export-results',{headers:{'x-teacher-code':code}});if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.error||'Export failed')}const blob=await r.blob();const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Trail_of_Tears_Tracking.xlsx';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);$('#msg').textContent='Excel file downloaded.'}catch(e){$('#msg').innerHTML=`<span class="error">${esc(e.message)}</span>`}}$('#load').onclick=load;$('#refresh').onclick=load;$('#excel').onclick=excel;['search','classFilter','statusFilter'].forEach(id=>$('#'+id).addEventListener(id==='search'?'input':'change',render));
</script></body></html>
